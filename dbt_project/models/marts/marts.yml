version: 2
models:
  - name: fct_orders
    description: One row per valid order. Incremental (1 day overlap, delete+insert on order_id).
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: merchant_id
        data_tests:
          - relationships:
              arguments: {to: "ref('dim_merchants')", field: merchant_id}
      - name: gmv
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [delivered, cancelled_customer, cancelled_merchant, cancelled_no_courier]
  - name: dim_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: segment
        data_tests:
          - accepted_values:
              arguments:
                values: [never_ordered, one_time, repeat, loyal]
  - name: dim_merchants
    columns:
      - name: merchant_id
        data_tests: [unique, not_null]
  - name: dim_couriers
    columns:
      - name: courier_id
        data_tests: [unique, not_null]
  - name: mart_customer_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
  - name: mart_daily_kpis
    columns:
      - name: day
        data_tests: [unique, not_null]
  - name: dq_report
    columns:
      - name: check_name
        data_tests: [unique, not_null]
